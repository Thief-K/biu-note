<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BiuNote" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiuNote</title>
    
    <!-- Critical Inline Styles to prevent white canvas paint before CSS/JS is loaded -->
    <style>
      :root {
        color-scheme: dark;
      }
      html.dark, html.dark body, html.dark #root {
        background-color: #09090b !important;
        color: #f4f4f5 !important;
      }
      html.light, html.light body, html.light #root {
        background-color: #f4f4f6 !important;
        color: #18181b !important;
      }
    </style>

    <!-- Synchronous script to immediately set theme classes before first DOM paint -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('biunote-theme') || 'dark';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Direct CSS Link for browser to block first paint until styling is ready -->
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
